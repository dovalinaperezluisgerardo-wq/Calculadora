<!doctype html>
<html>
    <head>
        <title>CALCULADORA</title>
        <!-- Permite adaptar la página a diferentes tamaños de pantalla -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 title="titulo de la pag">CALCULADORA </h1>
        <div class="calculadora">
            <div class="pantalla">
                <p>0</p>
            </div>
            <div class="botones">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operacion">/</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operacion">x</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operacion">-</button>
                <button>0</button>
                <button class="borrar">C</button>
                <button class="igual">=</button>
                <button class="operacion">+</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
